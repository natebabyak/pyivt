name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pyarrow: [latest, "14.0.2"]
    env:
      PYIVT_REQUIRE_DATA: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install package
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check public API
        run: uv run ty check python tests/typing

      - name: Download fixtures
        run: uv run python scripts/download_test_inputs.py --manifest tests/corpus/training.json

      - name: Rust tests
        run: cargo test

      - name: Compile native fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked

      - name: Install minimum supported Arrow
        if: matrix.pyarrow == '14.0.2'
        run: uv pip install 'pyarrow==14.0.2' 'numpy<2'

      - name: Test
        run: uv run --no-sync pytest
