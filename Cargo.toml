[package]
name = "pyivt"
version = "0.0.10"
edition = "2021"

[lib]
name = "pyivt"
crate-type = ["cdylib", "rlib"]

[features]
fuzzing = []

[dependencies]
arrow = { version = "54", default-features = false, features = ["ffi"] }
once_cell = "1"
pyo3 = { version = "0.23", features = ["abi3-py310"] }
rayon = "1.10"
regex = "1"
sha2 = "0.10"

[dev-dependencies]
encoding_rs = "0.8"
