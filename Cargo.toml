[package]
name = "pyivt"
version = "0.0.10"
edition = "2021"

[lib]
name = "pyivt"
crate-type = ["cdylib", "rlib"]

[features]
fuzzing = []

[dependencies]
arrow = { version = "54", default-features = false, features = ["ffi"] }
memmap2 = "0.9"
once_cell = "1"
pyo3 = { version = "0.23", features = ["abi3-py311"] }
rayon = "1.10"
regex = "1"
sha2 = "0.10"

[dev-dependencies]
encoding_rs = "0.8"

# Smaller wheels. Measured in docs/benchmarks/release-profile.md (NAT-256).
# codegen-units stays at the default (16): codegen-units = 1 made the value
# decoder about 15% slower. panic stays "unwind" so PyO3 can turn a Rust
# panic into PanicException, and the thread::scope join in compact.rs can
# report a panicked value decoder, instead of aborting the interpreter.
[profile.release]
lto = "fat"
strip = true
