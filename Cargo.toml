[package]
name = "pyivt"
version = "0.0.5"
edition = "2021"

[lib]
name = "pyivt"
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow = { version = "54", default-features = false, features = ["ffi"] }
encoding_rs = "0.8"
once_cell = "1"
pyo3 = { version = "0.23", features = ["abi3-py310"] }
regex = "1"
