[project]
name = "pyivt"
version = "0.0.2"
description = "Read Statistics Canada Beyond 20/20 .ivt tables: metadata and Apache Arrow export"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nate Babyak" }]
keywords = [
  "arrow",
  "beyond-2020",
  "ivt",
  "pyarrow",
  "statcan",
  "statistics-canada",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "pyarrow>=14",
]

[project.urls]
Changelog = "https://github.com/natebabyak/pyivt/blob/main/CHANGELOG.md"
Homepage = "https://github.com/natebabyak/pyivt"
Issues = "https://github.com/natebabyak/pyivt/issues"
Repository = "https://github.com/natebabyak/pyivt.git"

[dependency-groups]
dev = [
  "beautifulsoup4>=4",
  "maturin>=1.0,<2.0",
  "polars>=2.0",
  "pyperclip>=1.0",
  "pytest>=9.0",
  "pywinauto>=0.6",
  "rpy2>=3.0",
  "ruff>=0.17",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "pyivt._native"
python-source = "python"

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev"]
