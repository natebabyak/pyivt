[project]
name = "pyivt"
version = "0.1.0"
description = "Read Statistics Canada Beyond 20/20 .ivt tables: metadata and Apache Arrow export"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "pyivt contributors" }]
dependencies = [
  "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "maturin>=1.5,<2"]

[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "pyivt._native"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
